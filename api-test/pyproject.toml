[project]
name = "petstore-api-tests"
version = "1.0.0"
description = "API Test Automation for Petstore Pet Endpoints"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --alluredir=allure-results"
